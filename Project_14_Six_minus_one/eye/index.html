<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CogniLens Eye Tracking</title>
    <link rel="stylesheet" href="./styles.css?v=eye-logo-1" />
  </head>
  <body>
    <header class="app-nav">
      <div class="app-nav-inner">
        <a class="app-brand" href="/">
          <img class="app-brand-mark" src="/logo-mascot.png" alt="CogniLens mascot" />
          <span class="app-brand-name">CogniLens</span>
        </a>

        <nav class="app-nav-links" aria-label="Primary">
          <a class="active-link" href="./" title="Stay on Eye Tracking (keeps ?run_id= in the URL)">Eye Tracking</a>
          <a href="/history">History</a>
          <button id="backToAnalysisButton" class="nav-cta nav-cta-return" type="button" hidden>
            <span class="nav-cta-icon" aria-hidden="true">←</span>
            Back to analysis
          </button>
        </nav>
      </div>
    </header>

    <div class="app-shell">
      <section class="url-panel" aria-label="Target page and tracking controls">
        <div class="url-panel-start">
          <label class="url-panel-label" for="urlInput">URL</label>
          <input
            id="urlInput"
            class="url-panel-url"
            type="text"
            inputmode="url"
            placeholder="https://example.com"
            value="https://example.com"
            title="Target page URL"
          />
          <button id="loadUrlBtn" type="button">Load URL</button>
          <input
            id="loadHtmlInput"
            type="file"
            accept=".html,.htm,text/html,.zip,application/zip,application/x-zip-compressed"
            hidden
          />
          <button id="loadHtmlBtn" type="button">Load HTML/ZIP…</button>
        </div>
        <div class="url-panel-actions">
          <button id="startBtn" type="button" class="start-tracking-primary">
            Start Tracking
          </button>
          <button id="pauseBtn" type="button" disabled>Pause</button>
          <button id="toggleHeatmapBtn" type="button" disabled>Show Heatmap</button>
          <button id="saveBtn" type="button" disabled>Save Session</button>
        </div>
      </section>

      <section id="viewport" aria-label="Gaze tracking area">
        <iframe
          id="targetFrame"
          title="Tracked webpage"
          src="/eye/proxy?url=https%3A%2F%2Fexample.com"
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>

        <p id="frameHint" class="frame-hint">
          Page is loaded through local proxy mode for better compatibility.
        </p>

        <canvas id="heatmapCanvas"></canvas>
        <div id="gazeDot" aria-hidden="true"></div>
        <div id="calibrationUiGroup" class="calibration-ui-group" hidden></div>
      </section>

      <aside class="stats-panel">
        <div class="status-row">
          <span class="label">Status</span>
          <span id="statusText">Idle - click "Start Tracking"</span>
        </div>
        <div class="status-row">
          <span class="label">Gaze</span>
          <span id="coordsText">x: -, y: -</span>
        </div>
        <div class="status-row">
          <span class="label">Samples</span>
          <span id="samplesText">0</span>
        </div>
        <div class="status-row">
          <span class="label">Coverage</span>
          <span id="coverageText">0%</span>
        </div>
        <div class="status-row status-row-linked-run" id="linkedRunRow" hidden>
          <span class="label">Linked report</span>
          <span id="linkedRunText" class="linked-run-text" title="">—</span>
        </div>

        <h2>Visited Map</h2>
        <canvas id="coverageCanvas" width="300" height="180"></canvas>
      </aside>
    </div>

    <script src="https://api.gazerecorder.com/GazeCloudAPI.js"></script>
    <script src="./app.js?v=eye-controls-cleanup-1"></script>
  </body>
</html>
